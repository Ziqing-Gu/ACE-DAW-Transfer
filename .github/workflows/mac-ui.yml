name: Installed macOS window
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful installer build run
        required: true
permissions:
  contents: read
  actions: read
jobs:
  window:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: macOS-installer
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
      - name: Open the installed app and check its window
        run: |
          set -euo pipefail
          sudo installer -pkg ACE-DAW-Transfer-1.4.10-macOS.pkg -target /
          app="/Applications/ACE-DAW Transfer.app/Contents/MacOS/ACE-DAW Transfer"
          "$app" > "$RUNNER_TEMP/ace-window.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          swift packaging/window_probe.swift "$app_pid" || { cat "$RUNNER_TEMP/ace-window.log"; exit 1; }
      - name: Exercise the language control and restore it on relaunch
        run: |
          python -m pip install -r packaging/requirements-mac.txt
          python -m unittest discover -s tests -p test_ui_language.py -v

