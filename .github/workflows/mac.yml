name: macOS installers
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-mac.txt
      - run: python -m unittest discover -s tests -q
      - name: Build and exercise native application
        run: bash packaging/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: component-${{ matrix.arch }}
          path: artifacts/*.pkg
          if-no-files-found: error
  package:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: component-*
          path: components
          merge-multiple: true
      - run: productbuild --distribution packaging/Distribution.xml --package-path components ACE-DAW-Transfer-1.4.10-macOS.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-installer
          path: ACE-DAW-Transfer-1.4.10-macOS.pkg
  verify-install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: macOS-installer
      - name: Install and test the selected architecture
        run: |
          set -euo pipefail
          sudo installer -pkg ACE-DAW-Transfer-1.4.10-macOS.pkg -target /
          app="/Applications/ACE-DAW Transfer.app/Contents/MacOS/ACE-DAW Transfer"
          lipo -verify_arch "$(uname -m)" "$app"
          python -m pip install -r packaging/requirements-mac.txt
          PYTHONPATH="$PWD" python packaging/smoke.py "$app"

